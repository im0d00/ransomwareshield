[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomwareshield"
version = "0.1.0"
description = "A Python-based ransomware detection and prevention tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ransomwareshield = "ransomwareshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
